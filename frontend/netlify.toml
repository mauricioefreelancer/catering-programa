[build]
  command = "npm install && npm run build"
  publish = "dist"
  base = ""

[build.environment]
  NODE_VERSION = "20"
  # ===== IMPORTANTE: CAMBIAR ESTA URL POR LA DE TU BACKEND DESPLEGADO (Railway / Render) =====
  #   - Railway : https://catering-backend-production.up.railway.app/api
  #   - Render  : https://catering-backend-abc1.onrender.com/api
  # ⚠️ SIEMPRE TERMINA CON /api (NO olvidar la barra inversa final)
  VITE_API_URL = "https://TU-BACKEND.onrender.com/api"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
