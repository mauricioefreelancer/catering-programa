services:
  - type: web
    name: catering-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: "npm install --include=dev && npm run build && npx prisma generate && npx prisma migrate deploy"
    startCommand: "node dist/src/main.js"
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
        description: "Versión Node.js LTS (Render usa NODE_VERSION en runtime Node)"
      - key: DATABASE_URL
        value: "postgresql://catering_user:TEKbgI8CFZhHMDhy1wa0z0jjHA6glEsu@dpg-daopu6h42hec73fmugag-a.oregon-postgres.render.com/catering_db_97na?schema=public&pgbouncer=true"
        description: "Pooled PgBouncer Interna Render. Params schema=public&pgbouncer=true OBLIGATORIOS Prisma"
      - key: DIRECT_URL
        value: "postgresql://catering_user:TEKbgI8CFZhHMDhy1wa0z0jjHA6glEsu@dpg-daopu6h42hec73fmugag-a.oregon-postgres.render.com/catering_db_97na?schema=public"
        description: "Conexion Directa (sin PgBouncer) Interna Render. Usada solo para migraciones Prisma. schema=public OBLIGATORIO."
      - key: JWT_SECRET
        generateValue: true
        description: "Firma tokens JWT. Genera 64 chars. NO compartir."
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: CORS_ORIGIN
        value: "https://incandescent-paprenjak-78b703.netlify.app"
        description: "Dominio Frontend Netlify. NO barra final."
      - key: TARIFA_PROMEDIO_DEFAULT
        value: "3500"
      - key: UMBRAL_MARGEN
        value: "30"
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    healthCheckPath: "/api/auth/providers"
    numInstances: 1
